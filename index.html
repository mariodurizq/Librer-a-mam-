<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi librería</title>
<meta name="description" content="Catálogo de la librería de mamá: busca, filtra y añade libros.">
<meta name="theme-color" content="#f4eee4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238a3b2a'/%3E%3Crect x='24' y='22' width='14' height='56' rx='3' fill='%23f4eee4'/%3E%3Crect x='43' y='22' width='14' height='56' rx='3' fill='%23e4b363'/%3E%3Crect x='62' y='26' width='14' height='52' rx='3' fill='%23f4eee4' transform='rotate(8 69 52)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f4eee4; --bg2:#ece4d6; --card:#fffdf8; --ink:#2a2118; --muted:#6f6454; --line:#ded3bf;
  --accent:#8a3b2a; --accent-ink:#fff8ee; --gold:#c98f2c; --ok:#3f7d4e; --warn:#b4691c; --bad:#b33a3a;
  --shadow:0 1px 2px rgba(60,40,10,.08),0 8px 24px rgba(60,40,10,.07);
  --r:16px; --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --serif:Fraunces,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16120e; --bg2:#1e1812; --card:#241d16; --ink:#f1e8da; --muted:#a69a87; --line:#3a3025;
    --accent:#d9825f; --accent-ink:#1c1208; --gold:#e4b363; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:12.5px}
code{background:var(--bg2);padding:1px 6px;border-radius:6px;font-size:.9em}

/* Cabecera */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand h1{font-size:22px;line-height:1.1}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;grid-auto-flow:column;gap:3px;align-content:center;justify-content:center;padding:0 8px}
.logo i{display:block;width:6px;height:22px;border-radius:2px;background:var(--accent-ink);align-self:center}
.logo i:nth-child(2){background:#e4b363;height:24px}.logo i:nth-child(3){transform:rotate(9deg);height:20px}
.tabs{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:999px}
.tab{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.top-actions{display:flex;gap:8px}

.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;transition:transform .12s,background .12s,border-color .12s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.file{justify-content:center}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;padding:6px 8px;border-radius:8px}
.x:hover{background:var(--bg2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:1180px;margin:0 auto;padding:16px 16px 90px}
.view[hidden]{display:none}

/* Búsqueda y filtros */
.searchbar{display:flex;gap:10px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent)}
.search svg{color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;padding:12px 4px;outline:0;min-width:0;font-size:16px}
#fCount{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;padding:1px 7px;margin-left:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip small{color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)} .chip.on small{color:inherit;opacity:.7}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:14px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);align-items:end}
.filters[hidden]{display:none}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
select,input:not([type=checkbox]):not([type=file]),textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;color:var(--ink);font-size:15px;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
.result-bar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 10px;color:var(--muted);font-size:13.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--bg2);color:var(--ink)}

/* Tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid.list{grid-template-columns:1fr;gap:6px}
.card{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:104px}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.spine{flex:none;width:14px;background:var(--sp,#8a3b2a);position:relative}
.spine::after{content:"";position:absolute;inset:10px 3px;border-top:2px solid rgba(255,255,255,.35);border-bottom:2px solid rgba(255,255,255,.35)}
.card-body{padding:12px 12px 10px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.card h3{font-size:16.5px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .au{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:6px;font-size:12px;color:var(--muted)}
.tag{background:var(--bg2);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--ink)}
.tag.loc{background:transparent;border:1px solid var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.Alta{background:var(--ok)}.dot.Media{background:var(--gold)}.dot.Baja{background:var(--bad)}
.card-act{position:absolute;top:6px;right:6px;display:flex;gap:2px}
.ic{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:5px;border-radius:8px;opacity:.55;filter:grayscale(1)}
.ic:hover{opacity:1;background:var(--bg2)} .ic.on{opacity:1;filter:none}
.card.read h3{opacity:.65}
.card h3,.card .au{padding-right:46px}
.badge-new{font-size:10.5px;background:var(--gold);color:#2a1d00;border-radius:6px;padding:1px 6px;font-weight:600}
.grid.list .card{min-height:0}
.grid.list .card-body{flex-direction:row;align-items:center;gap:14px;padding:9px 12px}
.grid.list .card h3{font-size:15px;-webkit-line-clamp:1;flex:2;padding:0}
.grid.list .card .au{flex:1.3;padding:0}
.grid.list .card .meta{margin:0;padding:0;flex:1.4;justify-content:flex-end}
.grid.list .card-act{position:static;margin-right:6px;align-self:center}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.more{text-align:center;margin:18px 0}

/* Estanterías */
.shelf-block{margin-bottom:22px}
.shelf-block>h2{font-size:21px;margin:6px 0 10px}
.shelf{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 0;overflow:hidden}
.shelf h3{font-size:14px;font-family:var(--font);font-weight:600;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.books{display:flex;gap:3px;align-items:flex-end;overflow-x:auto;padding:4px 2px 0;scrollbar-width:thin}
.bk{flex:none;width:26px;min-height:96px;border:0;border-radius:3px 3px 0 0;background:var(--sp);cursor:pointer;position:relative;padding:6px 0;display:flex;justify-content:center;transition:transform .12s}
.bk:hover{transform:translateY(-6px)}
.bk span{writing-mode:vertical-rl;color:#fff;font-size:11px;font-weight:500;max-height:130px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.bk.read{opacity:.55}
.plank{height:10px;background:linear-gradient(var(--line),color-mix(in srgb,var(--line) 70%,#000));margin:0 -12px}

/* Resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel h2{font-size:17px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font:700 30px/1 var(--serif)} .kpi span{color:var(--muted);font-size:13px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:13.5px;cursor:pointer}
.bar .n{text-align:right;color:var(--muted)}
.bar .t{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Diálogos */
.dlg{border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 24px 80px rgba(0,0,0,.35)}
.dlg.small{width:min(480px,calc(100vw - 24px));padding:18px}
.dlg::backdrop{background:rgba(20,12,4,.55);backdrop-filter:blur(3px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.dlg.small .dlg-head{padding:0 0 8px}
.dlg-head h2{font-size:21px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 18px}
.span2{grid-column:1/-1}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 18px;position:sticky;bottom:0;background:var(--card)}
.hint{margin-right:auto;font-size:12.5px;color:var(--muted)}
.det-hero{display:flex}
.det-hero .spine{width:22px}
.det-body{padding:20px 20px 8px;flex:1;min-width:0}
.det-body h2{font-size:26px;line-height:1.15;padding-right:30px}
.det-body .au{font-size:16.5px;color:var(--muted);margin:4px 0 12px}
.det-close{position:absolute;top:10px;right:10px}
dl.facts{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:14px 0;font-size:14.5px}
dl.facts dt{color:var(--muted)} dl.facts dd{margin:0}
.det-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px 20px}
.menu-list{display:grid;gap:8px;margin:14px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);z-index:99;font-size:14px;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}

@media (max-width:720px){
  .hide-sm{display:none}
  .top-in{gap:8px;padding:8px 12px}
  .brand{flex:1 0 100%;order:1}
  .tabs{order:3;flex:1}
  .tab{flex:1;padding:7px 8px}
  .top-actions{order:2;position:absolute;right:12px;top:8px}
  .brand h1{font-size:19px}
  .brand{padding-right:130px}
  .form-grid{grid-template-columns:1fr 1fr}
  dl.facts{grid-template-columns:100px 1fr}
  .bar{grid-template-columns:100px 1fr 38px}
  .grid.list .card-body{flex-wrap:wrap;gap:2px 10px}
  .grid.list .card h3{flex:1 0 100%}
  .grid.list .card .meta{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.searchbar,.chips,.filters,.more,.card-act{display:none!important}}

/* ajustes: que los botones de la tarjeta no pisen el título */
.card-body{padding-right:64px}
.grid.list .card-body{padding-right:72px}
.search input{background:transparent;box-shadow:none;border:0}

[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <div>
        <h1>Mi librería</h1>
        <p id="subtitle">Cargando…</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab on" data-view="libros" role="tab">Libros</button>
      <button class="tab" data-view="estanterias" role="tab">Estanterías</button>
      <button class="tab" data-view="resumen" role="tab">Resumen</button>
    </nav>
    <div class="top-actions">
      <button class="btn ghost" id="btnRandom" title="Sugerir un libro al azar">🎲 <span class="hide-sm">Sorpréndeme</span></button>
      <button class="btn ghost" id="btnMenu" title="Exportar / copia de seguridad">⋯</button>
      <button class="btn primary" id="btnAdd">＋ <span class="hide-sm">Añadir libro</span></button>
    </div>
  </div>
</header>

<main>
  <section id="view-libros" class="view">
    <div class="searchbar">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm5 12 4 4"/></svg>
        <input id="q" type="search" placeholder="Busca por título, autor, editorial o nota…" autocomplete="off">
        <button id="qClear" class="x" hidden aria-label="Borrar búsqueda">✕</button>
      </div>
      <button class="btn ghost" id="btnFilters">Filtros <b id="fCount" hidden></b></button>
    </div>
    <div class="chips" id="catChips" aria-label="Categorías"></div>
    <div class="filters" id="filters" hidden>
      <label>Mueble<select id="fMueble"></select></label>
      <label>Balda<select id="fBalda"></select></label>
      <label>Confianza de lectura<select id="fConf"><option value="">Todas</option><option>Alta</option><option>Media</option><option>Baja</option></select></label>
      <label>Origen<select id="fOrigen"><option value="">Todos</option><option value="video">De los vídeos</option><option value="manual">Añadidos a mano</option></select></label>
      <label>Estado<select id="fEstado"><option value="">Todos</option><option value="leido">Leídos</option><option value="pendiente">Sin marcar</option><option value="fav">Favoritos</option></select></label>
      <label>Ordenar por<select id="fSort"><option value="orden">Posición en la estantería</option><option value="titulo">Título (A–Z)</option><option value="autor">Autor (A–Z)</option><option value="nuevos">Añadidos recientemente</option></select></label>
      <button class="btn ghost" id="fReset">Limpiar filtros</button>
    </div>
    <div class="result-bar">
      <span id="resultCount"></span>
      <div class="seg" role="group" aria-label="Vista">
        <button data-layout="grid" class="on" title="Tarjetas">▦</button>
        <button data-layout="list" title="Lista">☰</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <p>No hay libros con esos filtros.</p>
      <button class="btn" id="emptyAdd">Añadir este libro a mano</button>
    </div>
    <div class="more"><button class="btn ghost" id="btnMore" hidden>Mostrar más</button></div>
  </section>

  <section id="view-estanterias" class="view" hidden></section>
  <section id="view-resumen" class="view" hidden></section>
</main>

<!-- Detalle -->
<dialog id="dlgDetail" class="dlg"><div id="detail"></div></dialog>

<!-- Formulario -->
<dialog id="dlgForm" class="dlg">
  <form id="form" method="dialog" autocomplete="off">
    <div class="dlg-head"><h2 id="formTitle">Añadir libro</h2><button type="button" class="x" data-close aria-label="Cerrar">✕</button></div>
    <div class="form-grid">
      <label class="span2">Título *<input name="titulo" required maxlength="200"></label>
      <label>Autor<input name="autor" list="dlAutores" maxlength="160"></label>
      <label>Editorial / colección<input name="editorial" list="dlEditoriales" maxlength="120"></label>
      <label>Categoría<input name="categoria" list="dlCategorias" maxlength="60" required></label>
      <label>Tomo / nº<input name="tomo" maxlength="40" placeholder="ej. vol. II, nº 12"></label>
      <label>Mueble<input name="mueble" type="number" min="1" step="1" inputmode="numeric"></label>
      <label>Balda<input name="balda" type="number" min="1" step="1" inputmode="numeric"></label>
      <label>Posición<input name="posicion" type="number" min="1" step="1" inputmode="numeric" placeholder="auto"></label>
      <label>Confianza<select name="confianza"><option>Alta</option><option>Media</option><option>Baja</option></select></label>
      <label class="span2">Notas<textarea name="notas" rows="3" maxlength="600" placeholder="Edición, estado, dedicatoria, dónde está exactamente…"></textarea></label>
    </div>
    <datalist id="dlAutores"></datalist><datalist id="dlEditoriales"></datalist><datalist id="dlCategorias"></datalist>
    <div class="dlg-foot">
      <span class="hint" id="formHint"></span>
      <button type="button" class="btn ghost" data-close>Cancelar</button>
      <button type="submit" class="btn primary" id="formSave">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Menú exportar -->
<dialog id="dlgMenu" class="dlg small">
  <div class="dlg-head"><h2>Guardar y compartir</h2><button type="button" class="x" data-close aria-label="Cerrar">✕</button></div>
  <p class="muted">Los libros que añadas o edites aquí se guardan <b>en este navegador</b>. Para publicarlos en la web, descarga <code>libros.js</code> y sustituye el de la carpeta <code>data/</code> del repositorio.</p>
  <div class="menu-list">
    <button class="btn" id="exJs">⬇ Descargar libros.js (para publicar)</button>
    <button class="btn" id="exCsv">⬇ Descargar CSV (abrir en Excel)</button>
    <button class="btn" id="exBackup">⬇ Copia de seguridad de mis cambios</button>
    <label class="btn file">⬆ Restaurar copia de seguridad<input type="file" id="imBackup" accept="application/json,.json" hidden></label>
    <button class="btn danger" id="exReset">Borrar mis cambios en este navegador</button>
  </div>
  <p class="muted small" id="menuStats"></p>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  const KEY = 'libreria.v1';
  const PAGE = 60;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const norm = s => (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- Estado persistente ---------- */
  const blank = () => ({ added: [], edits: {}, deleted: [], fav: [], read: [], seq: 0 });
  let U = blank();
  function loadUser() {
    try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && typeof r === 'object') U = Object.assign(blank(), r); } catch (e) { U = blank(); }
  }
  function saveUser() {
    try { localStorage.setItem(KEY, JSON.stringify(U)); } catch (e) { toast('No se pudo guardar en este navegador (¿modo privado?)'); }
  }

  /* ---------- Libros ---------- */
  const BASE = (window.LIBROS || []).map(b => ({ ...b, origen: 'video' }));
  let BOOKS = [];
  function rebuild() {
    const del = new Set(U.deleted);
    const list = [];
    for (const b of BASE) {
      if (del.has(b.id)) continue;
      list.push(U.edits[b.id] ? { ...b, ...U.edits[b.id], id: b.id, origen: 'video', editado: true } : b);
    }
    for (const b of U.added) if (!del.has(b.id)) list.push({ ...b, origen: 'manual' });
    BOOKS = list.map((b, i) => ({ ...b, _i: i, _s: norm([b.titulo, b.autor, b.editorial, b.categoria, b.notas, b.tomo].join(' ')) }));
  }
  const byId = id => BOOKS.find(b => b.id === id);
  const favSet = () => new Set(U.fav), readSet = () => new Set(U.read);

  function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
  const spine = b => `hsl(${hue((b.titulo || '') + (b.autor || ''))} 38% 36%)`;
  const loc = b => [b.mueble ? 'M' + b.mueble : '', b.balda ? 'B' + b.balda : '', b.posicion ? '#' + b.posicion : ''].filter(Boolean).join(' · ');

  /* ---------- Filtros ---------- */
  const F = { q: '', cat: '', mueble: '', balda: '', conf: '', origen: '', estado: '', sort: 'orden', layout: 'grid', shown: PAGE };
  function filtered() {
    const terms = norm(F.q).split(/\s+/).filter(Boolean);
    const fav = favSet(), read = readSet();
    let r = BOOKS.filter(b => {
      if (F.cat && b.categoria !== F.cat) return false;
      if (F.mueble && String(b.mueble) !== F.mueble) return false;
      if (F.balda && String(b.balda) !== F.balda) return false;
      if (F.conf && b.confianza !== F.conf) return false;
      if (F.origen && b.origen !== F.origen) return false;
      if (F.estado === 'leido' && !read.has(b.id)) return false;
      if (F.estado === 'pendiente' && read.has(b.id)) return false;
      if (F.estado === 'fav' && !fav.has(b.id)) return false;
      return terms.every(t => b._s.includes(t));
    });
    const cmp = {
      orden: (a, b) => (a.mueble || 99) - (b.mueble || 99) || (a.balda || 99) - (b.balda || 99) || (a.posicion || 0) - (b.posicion || 0) || a._i - b._i,
      titulo: (a, b) => norm(a.titulo).localeCompare(norm(b.titulo), 'es'),
      autor: (a, b) => (norm(a.autor) || '~').localeCompare(norm(b.autor) || '~', 'es') || norm(a.titulo).localeCompare(norm(b.titulo), 'es'),
      nuevos: (a, b) => (b.creado || 0) - (a.creado || 0) || b._i - a._i
    }[F.sort];
    return r.sort(cmp);
  }

  /* ---------- Render: libros ---------- */
  function cardHtml(b, fav, read) {
    const isF = fav.has(b.id), isR = read.has(b.id);
    return `<article class="card ${isR ? 'read' : ''}" data-id="${b.id}" tabindex="0" style="--sp:${spine(b)}">
      <div class="spine"></div>
      <div class="card-body">
        <h3>${esc(b.titulo)}${b.tomo ? ` <span class="muted" style="font-weight:400;font-family:var(--font);font-size:13px">· ${esc(b.tomo)}</span>` : ''}</h3>
        <div class="au">${esc(b.autor) || '<i>Autor sin identificar</i>'}</div>
        <div class="meta">
          <span class="tag">${esc(b.categoria)}</span>
          ${loc(b) ? `<span class="tag loc">${loc(b)}</span>` : ''}
          ${b.confianza && b.confianza !== 'Alta' ? `<span title="Confianza de lectura: ${b.confianza}"><span class="dot ${b.confianza}"></span></span>` : ''}
          ${b.origen === 'manual' ? '<span class="badge-new">añadido</span>' : ''}
        </div>
      </div>
      <div class="card-act">
        <button class="ic ${isF ? 'on' : ''}" data-act="fav" title="Favorito" aria-label="Favorito">❤️</button>
        <button class="ic ${isR ? 'on' : ''}" data-act="read" title="Marcar como leído" aria-label="Marcar como leído">✅</button>
      </div>
    </article>`;
  }
  function renderBooks() {
    const list = filtered();
    const fav = favSet(), read = readSet();
    const grid = $('#grid');
    grid.className = 'grid' + (F.layout === 'list' ? ' list' : '');
    grid.innerHTML = list.slice(0, F.shown).map(b => cardHtml(b, fav, read)).join('');
    $('#empty').hidden = list.length > 0;
    $('#btnMore').hidden = list.length <= F.shown || !list.length;
    $('#btnMore').textContent = `Mostrar más (${list.length - F.shown} restantes)`;
    $('#resultCount').textContent = list.length === BOOKS.length ? `${list.length} libros` : `${list.length} de ${BOOKS.length} libros`;
    const active = ['mueble', 'balda', 'conf', 'origen', 'estado'].filter(k => F[k]).length + (F.sort !== 'orden' ? 1 : 0);
    const fc = $('#fCount'); fc.hidden = !active; fc.textContent = active;
    $('#qClear').hidden = !F.q;
  }
  function renderChips() {
    const counts = {}; BOOKS.forEach(b => counts[b.categoria] = (counts[b.categoria] || 0) + 1);
    const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    $('#catChips').innerHTML = `<button class="chip ${F.cat ? '' : 'on'}" data-cat="">Todos <small>${BOOKS.length}</small></button>` +
      cats.map(c => `<button class="chip ${F.cat === c ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)} <small>${counts[c]}</small></button>`).join('');
  }
  function renderSelects() {
    const mu = [...new Set(BOOKS.map(b => b.mueble).filter(Boolean))].sort((a, b) => a - b);
    const ba = [...new Set(BOOKS.filter(b => !F.mueble || String(b.mueble) === F.mueble).map(b => b.balda).filter(Boolean))].sort((a, b) => a - b);
    $('#fMueble').innerHTML = '<option value="">Todos</option>' + mu.map(m => `<option ${String(m) === F.mueble ? 'selected' : ''}>${m}</option>`).join('');
    $('#fBalda').innerHTML = '<option value="">Todas</option>' + ba.map(m => `<option ${String(m) === F.balda ? 'selected' : ''}>${m}</option>`).join('');
    $('#fConf').value = F.conf; $('#fOrigen').value = F.origen; $('#fEstado').value = F.estado; $('#fSort').value = F.sort;
    const dl = (id, arr) => $(id).innerHTML = arr.map(x => `<option value="${esc(x)}">`).join('');
    dl('#dlAutores', [...new Set(BOOKS.map(b => b.autor).filter(Boolean))].sort());
    dl('#dlEditoriales', [...new Set(BOOKS.map(b => b.editorial).filter(Boolean))].sort());
    dl('#dlCategorias', [...new Set(BOOKS.map(b => b.categoria).filter(Boolean))].sort());
  }

  /* ---------- Render: estanterías ---------- */
  function renderShelves() {
    const read = readSet();
    const tree = {};
    BOOKS.forEach(b => { const m = b.mueble || 0, s = b.balda || 0; ((tree[m] ??= {})[s] ??= []).push(b); });
    let html = '';
    Object.keys(tree).sort((a, b) => a - b).forEach(m => {
      html += `<div class="shelf-block"><h2>${m == 0 ? 'Sin mueble asignado' : 'Mueble ' + m}</h2>`;
      Object.keys(tree[m]).sort((a, b) => a - b).forEach(s => {
        const bs = tree[m][s].sort((a, b) => (a.posicion || 0) - (b.posicion || 0) || a._i - b._i);
        html += `<div class="shelf"><h3><span>${s == 0 ? 'Sin balda' : 'Balda ' + s}</span><span>${bs.length} libros</span></h3>
          <div class="books">${bs.map(b => `<button class="bk ${read.has(b.id) ? 'read' : ''}" data-id="${b.id}" style="--sp:${spine(b)}" title="${esc(b.titulo)}${b.autor ? ' — ' + esc(b.autor) : ''}"><span>${esc(b.titulo)}</span></button>`).join('')}</div>
          <div class="plank"></div></div>`;
      });
      html += '</div>';
    });
    $('#view-estanterias').innerHTML = html || '<p class="empty">Aún no hay libros.</p>';
  }

  /* ---------- Render: resumen ---------- */
  function renderStats() {
    const read = readSet(), fav = favSet();
    const group = (fn) => { const o = {}; BOOKS.forEach(b => { const k = fn(b); o[k] = (o[k] || 0) + 1; }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
    const bars = (arr, key) => { const max = Math.max(1, ...arr.map(x => x[1])); return arr.map(([k, n]) => `<div class="bar" data-k="${key}" data-v="${esc(k)}"><span>${esc(k)}</span><div class="t"><i style="width:${n / max * 100}%"></i></div><span class="n">${n}</span></div>`).join(''); };
    const authors = group(b => b.autor || '').filter(x => x[0]).slice(0, 12);
    const unk = BOOKS.filter(b => !b.autor).length;
    const low = BOOKS.filter(b => b.confianza !== 'Alta').length;
    $('#view-resumen').innerHTML = `
      <div class="kpis">
        <div class="kpi"><b>${BOOKS.length}</b><span>libros catalogados</span></div>
        <div class="kpi"><b>${new Set(BOOKS.map(b => b.autor).filter(Boolean)).size}</b><span>autores distintos</span></div>
        <div class="kpi"><b>${read.size}</b><span>marcados como leídos</span></div>
        <div class="kpi"><b>${fav.size}</b><span>favoritos</span></div>
        <div class="kpi"><b>${low}</b><span>por revisar (confianza media/baja)</span></div>
        <div class="kpi"><b>${U.added.length}</b><span>añadidos a mano</span></div>
      </div>
      <div class="stats">
        <div class="panel"><h2>Por categoría</h2>${bars(group(b => b.categoria), 'cat')}</div>
        <div class="panel"><h2>Autores con más libros</h2>${bars(authors, 'autor')}<p class="muted small">${unk} libros sin autor identificado.</p></div>
        <div class="panel"><h2>Por mueble</h2>${bars(group(b => b.mueble ? 'Mueble ' + b.mueble : 'Sin mueble'), 'mueble')}</div>
        <div class="panel"><h2>Confianza de lectura</h2>${bars(group(b => b.confianza || 'Alta'), 'conf')}<p class="muted small">Media/Baja = lomo parcial o dudoso. Edita esos libros para corregirlos.</p></div>
      </div>`;
  }

  /* ---------- Detalle ---------- */
  function openDetail(id) {
    const b = byId(id); if (!b) return;
    const fav = favSet().has(id), rd = readSet().has(id);
    const q = encodeURIComponent((b.titulo + ' ' + (b.autor || '')).trim());
    const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
    $('#detail').innerHTML = `<div class="det-hero" style="--sp:${spine(b)};position:relative">
      <div class="spine"></div>
      <div class="det-body">
        <button class="x det-close" data-close aria-label="Cerrar">✕</button>
        <span class="tag">${esc(b.categoria)}</span>
        <h2 style="margin-top:8px">${esc(b.titulo)}</h2>
        <div class="au">${esc(b.autor) || '<i>Autor sin identificar</i>'}</div>
        <dl class="facts">
          ${row('Editorial / colección', b.editorial)}${row('Tomo / nº', b.tomo)}
          ${row('Ubicación', b.mueble || b.balda ? `Mueble ${b.mueble || '—'} · Balda ${b.balda || '—'} · Posición ${b.posicion || '—'}` : '')}
          <dt>Confianza</dt><dd><span class="dot ${b.confianza}"></span> ${esc(b.confianza || 'Alta')}${b.confianza && b.confianza !== 'Alta' ? ' — conviene revisar el lomo' : ''}</dd>
          ${row('Notas', b.notas)}
          ${row('Origen', b.origen === 'manual' ? 'Añadido a mano en la web' : 'Leído de ' + (b.video || 'vídeo'))}
          ${row('Referencia', b.id)}
        </dl>
      </div></div>
      <div class="det-actions">
        <button class="btn ${fav ? 'primary' : ''}" data-d="fav">❤️ ${fav ? 'En favoritos' : 'Favorito'}</button>
        <button class="btn ${rd ? 'primary' : ''}" data-d="read">✅ ${rd ? 'Leído' : 'Marcar leído'}</button>
        <button class="btn" data-d="edit">✎ Editar</button>
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}">🔎 Buscar en Google</a>
        <button class="btn danger" data-d="del">Eliminar</button>
      </div>`;
    $('#detail').dataset.id = id;
    $('#dlgDetail').showModal();
  }

  /* ---------- Formulario ---------- */
  let editingId = null;
  function openForm(id, prefill) {
    editingId = id || null;
    const f = $('#form'); f.reset();
    $('#formTitle').textContent = id ? 'Editar libro' : 'Añadir libro';
    $('#formHint').textContent = id ? '' : 'Si no indicas la posición, se pone al final de la balda.';
    const b = id ? byId(id) : { categoria: 'Narrativa', confianza: 'Alta', ...(prefill || {}) };
    for (const k of ['titulo', 'autor', 'editorial', 'categoria', 'tomo', 'mueble', 'balda', 'posicion', 'confianza', 'notas']) f.elements[k].value = b[k] ?? '';
    if (!id && !b.mueble) { const last = U.added[U.added.length - 1]; if (last) { f.elements.mueble.value = last.mueble || ''; f.elements.balda.value = last.balda || ''; } }
    $('#dlgDetail').close();
    $('#dlgForm').showModal();
    setTimeout(() => f.elements.titulo.focus(), 50);
  }
  function submitForm(e) {
    e.preventDefault();
    const f = e.target.elements, v = k => f[k].value.trim();
    const num = k => { const n = parseInt(f[k].value, 10); return Number.isFinite(n) && n > 0 ? n : null; };
    const titulo = v('titulo'); if (!titulo) { f.titulo.focus(); return; }
    const data = { titulo, autor: v('autor'), editorial: v('editorial'), categoria: v('categoria') || 'Sin categoría', tomo: v('tomo'), mueble: num('mueble'), balda: num('balda'), posicion: num('posicion'), confianza: f.confianza.value, notas: v('notas') };
    if (!data.posicion && data.mueble && data.balda) {
      data.posicion = 1 + Math.max(0, ...BOOKS.filter(b => b.mueble === data.mueble && b.balda === data.balda && b.id !== editingId).map(b => b.posicion || 0));
    }
    if (editingId) {
      const manual = U.added.findIndex(b => b.id === editingId);
      if (manual >= 0) U.added[manual] = { ...U.added[manual], ...data };
      else U.edits[editingId] = { ...(U.edits[editingId] || {}), ...data };
      toast('Cambios guardados');
    } else {
      U.seq = (U.seq || 0) + 1;
      U.added.push({ id: 'M' + String(Date.now()).slice(-7) + U.seq, ...data, video: '', creado: Date.now() });
      toast('Libro añadido');
    }
    saveUser(); refreshAll();
    $('#dlgForm').close();
  }

  /* ---------- Acciones ---------- */
  function toggle(arr, id) { const i = arr.indexOf(id); i >= 0 ? arr.splice(i, 1) : arr.push(id); return i < 0; }
  function deleteBook(id) {
    const b = byId(id); if (!b) return;
    if (!confirm(`¿Eliminar «${b.titulo}» de la librería?\n(Podrás recuperarlo restaurando una copia de seguridad.)`)) return;
    const m = U.added.findIndex(x => x.id === id);
    if (m >= 0) U.added.splice(m, 1); else U.deleted.push(id);
    U.fav = U.fav.filter(x => x !== id); U.read = U.read.filter(x => x !== id);
    saveUser(); refreshAll(); $('#dlgDetail').close(); toast('Libro eliminado');
  }
  function random() {
    const read = readSet();
    const pool = filtered().filter(b => !read.has(b.id));
    const src = pool.length ? pool : filtered();
    if (!src.length) return toast('No hay libros con esos filtros');
    openDetail(src[Math.floor(Math.random() * src.length)].id);
  }

  /* ---------- Exportar / importar ---------- */
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  const clean = b => ({ id: b.id, titulo: b.titulo, autor: b.autor || '', editorial: b.editorial || '', tomo: b.tomo || '', categoria: b.categoria, video: b.video || '', mueble: b.mueble ?? null, balda: b.balda ?? null, posicion: b.posicion ?? null, confianza: b.confianza || 'Alta', notas: b.notas || '' });
  function exportJs() {
    const arr = BOOKS.slice().sort((a, b) => (a.mueble || 99) - (b.mueble || 99) || (a.balda || 99) - (b.balda || 99) || (a.posicion || 0) - (b.posicion || 0) || a._i - b._i).map(clean);
    download('libros.js', 'window.LIBROS = ' + JSON.stringify(arr, null, 0).replace(/\},\{/g, '},\n{') + ';\n', 'text/javascript');
    toast('libros.js descargado: súbelo a data/ en GitHub');
  }
  function exportCsv() {
    const cols = ['id', 'titulo', 'autor', 'editorial', 'tomo', 'categoria', 'mueble', 'balda', 'posicion', 'confianza', 'notas'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [cols.join(';'), ...BOOKS.map(b => cols.map(c => q(clean(b)[c])).join(';'))];
    download('libreria.csv', '﻿' + rows.join('\r\n'), 'text/csv');
  }
  function exportBackup() { download('libreria-copia.json', JSON.stringify({ app: 'libreria', v: 1, user: U }, null, 1), 'application/json'); }
  function importBackup(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (d.app !== 'libreria' || !d.user) throw 0;
        if (!confirm('Esto sustituirá tus cambios actuales por los de la copia. ¿Continuar?')) return;
        U = Object.assign(blank(), d.user); saveUser(); refreshAll(); $('#dlgMenu').close(); toast('Copia restaurada');
      } catch (e) { toast('Ese archivo no es una copia válida'); }
    };
    r.readAsText(file);
  }

  /* ---------- Util UI ---------- */
  let tt;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
  function refreshAll() {
    rebuild(); renderChips(); renderSelects(); renderBooks(); renderShelves(); renderStats();
    $('#subtitle').textContent = `${BOOKS.length} libros · ${new Set(BOOKS.map(b => b.mueble).filter(Boolean)).size} muebles`;
    $('#menuStats').textContent = `Cambios guardados en este navegador: ${U.added.length} añadidos, ${Object.keys(U.edits).length} editados, ${U.deleted.length} eliminados, ${U.fav.length} favoritos, ${U.read.length} leídos.`;
  }
  function setView(v) {
    $$('.tab').forEach(t => { const on = t.dataset.view === v; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
    $$('.view').forEach(s => s.hidden = s.id !== 'view-' + v);
    try { history.replaceState(null, '', '#' + v); } catch (e) { }
    scrollTo({ top: 0 });
  }

  /* ---------- Eventos ---------- */
  function bind() {
    let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value; F.shown = PAGE; renderBooks(); }, 120); });
    $('#qClear').onclick = () => { $('#q').value = ''; F.q = ''; F.shown = PAGE; renderBooks(); $('#q').focus(); };
    $('#btnFilters').onclick = () => { const f = $('#filters'); f.hidden = !f.hidden; };
    $('#catChips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; F.cat = c.dataset.cat; F.shown = PAGE; renderChips(); renderBooks(); });
    const map = { fMueble: 'mueble', fBalda: 'balda', fConf: 'conf', fOrigen: 'origen', fEstado: 'estado', fSort: 'sort' };
    Object.entries(map).forEach(([id, k]) => $('#' + id).addEventListener('change', e => { F[k] = e.target.value; if (k === 'mueble') F.balda = ''; F.shown = PAGE; renderSelects(); renderBooks(); }));
    $('#fReset').onclick = () => { Object.assign(F, { q: '', cat: '', mueble: '', balda: '', conf: '', origen: '', estado: '', sort: 'orden', shown: PAGE }); $('#q').value = ''; renderChips(); renderSelects(); renderBooks(); };
    $('#btnMore').onclick = () => { F.shown += PAGE * 2; renderBooks(); };
    $$('.seg button').forEach(b => b.onclick = () => { F.layout = b.dataset.layout; $$('.seg button').forEach(x => x.classList.toggle('on', x === b)); try { localStorage.setItem(KEY + '.layout', F.layout); } catch (e) { } renderBooks(); });
    $$('.tab').forEach(t => t.onclick = () => setView(t.dataset.view));

    $('#grid').addEventListener('click', e => {
      const card = e.target.closest('.card'); if (!card) return;
      const id = card.dataset.id, act = e.target.closest('[data-act]');
      if (act) { const on = toggle(act.dataset.act === 'fav' ? U.fav : U.read, id); saveUser(); renderBooks(); renderStats(); renderShelves(); toast(act.dataset.act === 'fav' ? (on ? 'Añadido a favoritos' : 'Quitado de favoritos') : (on ? 'Marcado como leído' : 'Marcado como pendiente')); return; }
      openDetail(id);
    });
    $('#grid').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('card')) openDetail(e.target.dataset.id); });
    $('#view-estanterias').addEventListener('click', e => { const b = e.target.closest('.bk'); if (b) openDetail(b.dataset.id); });
    $('#view-resumen').addEventListener('click', e => {
      const bar = e.target.closest('.bar'); if (!bar) return;
      const k = bar.dataset.k, v = bar.dataset.v;
      Object.assign(F, { q: '', cat: '', mueble: '', balda: '', conf: '', origen: '', estado: '', shown: PAGE });
      if (k === 'cat') F.cat = v; else if (k === 'conf') F.conf = v; else if (k === 'mueble') F.mueble = v.replace('Mueble ', '');
      else if (k === 'autor') { F.q = v; $('#q').value = v; }
      if (k !== 'autor') $('#q').value = '';
      renderChips(); renderSelects(); renderBooks(); setView('libros');
    });

    $('#detail').addEventListener('click', e => {
      const id = $('#detail').dataset.id, d = e.target.closest('[data-d]');
      if (e.target.closest('[data-close]')) return $('#dlgDetail').close();
      if (!d) return;
      if (d.dataset.d === 'edit') return openForm(id);
      if (d.dataset.d === 'del') return deleteBook(id);
      toggle(d.dataset.d === 'fav' ? U.fav : U.read, id); saveUser(); refreshAll(); openDetail(id);
    });
    $$('dialog').forEach(dlg => {
      dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
    });
    $('#form').addEventListener('submit', submitForm);
    $('#btnAdd').onclick = () => openForm(null);
    $('#emptyAdd').onclick = () => openForm(null, { titulo: F.q });
    $('#btnRandom').onclick = random;
    $('#btnMenu').onclick = () => $('#dlgMenu').showModal();
    $('#exJs').onclick = exportJs; $('#exCsv').onclick = exportCsv; $('#exBackup').onclick = exportBackup;
    $('#imBackup').onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; };
    $('#exReset').onclick = () => { if (confirm('Se borrarán tus libros añadidos, ediciones, favoritos y leídos de este navegador. ¿Seguro?')) { U = blank(); saveUser(); refreshAll(); $('#dlgMenu').close(); toast('Cambios borrados'); } };
    document.addEventListener('keydown', e => { if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); setView('libros'); $('#q').focus(); } });
  }

  /* ---------- Arranque ---------- */
  loadUser();
  if (!BASE.length && !(JSON.parse(localStorage.getItem(KEY)||'{}').added||[]).length) setTimeout(()=>{ const e=$('#empty'); e.querySelector('p')&&(e.querySelector('p').innerHTML='<b>No se ha cargado el catálogo.</b><br>Falta el archivo <code>data/libros.js</code> en el repositorio (o está en otra ruta). Comprueba que existe la carpeta <code>data</code> junto a <code>index.html</code>.'); },0);
  try { const l = localStorage.getItem(KEY + '.layout'); if (l) { F.layout = l; $$('.seg button').forEach(x => x.classList.toggle('on', x.dataset.layout === l)); } } catch (e) { }
  bind(); refreshAll();
  const h = location.hash.slice(1); if (['libros', 'estanterias', 'resumen'].includes(h)) setView(h);
})();
</script>
</body>
</html>
